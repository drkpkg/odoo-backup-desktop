[[permission]]
identifier = "allow-app-commands"
description = "All Odoo Backup Desktop application commands."
commands.allow = [
  "get_app_status",
  "create_vault",
  "unlock_vault",
  "lock_vault",
  "set_master_password",
  "set_keychain_enabled",
  "list_instances",
  "save_instance",
  "delete_instance",
  "probe_instance",
  "start_backup",
  "cancel_backup",
  "list_active_jobs",
  "list_history",
  "reveal_backup",
  "get_settings",
  "update_settings",
  "get_drive_status",
  "set_drive_client",
  "connect_drive",
  "cancel_drive_connect",
  "disconnect_drive",
  "list_plugins",
  "reload_plugins",
  "set_plugin_enabled",
  "get_plugin_config",
  "set_developer_mode",
  "add_dev_plugin",
  "remove_dev_plugin",
  "open_plugins_folder",
  "get_plugin_settings",
  "save_plugin_settings",
  "plugin_storage_get",
  "plugin_storage_set",
  "open_plugin_window",
  "get_plugin_window_context",
]

[[permission]]
identifier = "allow-plugin-window-commands"
description = "Commands available to plugin windows (plugin shell + bridge)."
commands.allow = [
  "get_app_status",
  "list_instances",
  "list_history",
  "list_plugins",
  "get_plugin_settings",
  "save_plugin_settings",
  "plugin_storage_get",
  "plugin_storage_set",
  "open_plugin_window",
  "get_plugin_window_context",
]
