[package]
name = "obd-vault"
description = "Encrypted local vault for Odoo Backup Desktop credentials"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
base64.workspace = true
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4"
keyring-core = "1.0"
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# async-io, not rt-tokio: the tokio feature is unified into every zbus user (e.g. desktop
# notifications) and makes `zbus::block_on` panic inside tokio worker threads.
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
