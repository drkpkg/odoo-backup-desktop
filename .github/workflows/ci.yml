name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NODE_VERSION: "24"
  PNPM_VERSION: "11"

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file patchelf pkg-config \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # tauri::generate_context! expects the frontend dist directory to exist.
      - name: Prepare frontend dist placeholder
        run: mkdir -p dist

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # Windows and macOS ignore case: `SchemaForm.tsx` + `schemaForm.ts` break the Windows build
      # (TS1149) while Linux passes. Compares full paths and extensionless module paths.
      - name: File names are unique ignoring case
        shell: bash
        env:
          LC_ALL: C
        run: |
          collisions="$( { git ls-files; git ls-files | sed -E 's/\.(ts|tsx|js|jsx|mjs)$//'; } | sort -u | sort -f | uniq -di )"
          if [[ -n $collisions ]]; then
            echo "::error::Paths that only differ in case: $collisions"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run --if-present typecheck

      - name: Unit tests
        run: pnpm run --if-present test

      - name: Build
        run: pnpm build
